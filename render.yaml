databases:
  - name: hyg3-db
    plan: free
    region: oregon

services:
  - type: web
    name: hyg3-backend
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: hyg3-db
          property: connectionString
      - key: VITE_API_URL
        value: "https://hyg3-backend.onrender.com"
